site_name: Wattsworth Documentation

#site_url: /docs/
theme:
  name: material
  features: 
    - content.code.annotate
    - navigation.expand
extra_css:
  - custom.css
  
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: false
            show_bases: false


markdown_extensions:
  - attr_list
  - mkdocs-click
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.blocks.caption
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html

hooks:
  - reload_modules.py

nav:
   - Overview: overview.md
   - Getting Started:
      - Installation: installation.md
      - Walkthrough: quick_start.md
   - Jouled (server):
      - Configuration: configuration.md
      - Builtin Modules: module_included.md
      - Developing Modules: module_development.md
   - Joule (client):
      - API Documentation: api.md
      - CLI Documentation: cli.md
   - Lumen:
      - Data Explorer: lumen/explorer.md
      - Installation Settings: lumen/installation.md
      - Account Settings: lumen/account.md
   - About/License: about.md
