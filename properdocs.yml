site_name: Wattsworth
site_url: https://wattsworth.net
theme:
  name: material
  features: 
    - content.code.annotate

markdown_extensions:
  - attr_list
  - mkdocs-click
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.tabbed:
      alternate_style: true


hooks:
  - reload_modules.py